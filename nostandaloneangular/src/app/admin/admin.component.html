<div class="category-list-container">
    <h1>Category List</h1>
    <div class="category-cards-container">
      <div *ngFor="let category of categories" class="category-card">
        <h2>{{ category.name }}</h2>
        <div class="field-item">
          <span class="field-label">ID:</span>
          <span class="field-value">{{ category._id }}</span>
        </div>
        <div class="field-item">
          <span class="field-label">Description:</span>
          <span class="field-value">{{ category.description }}</span>
        </div>
        <div class="field-item">
          <span class="field-label">Status:</span>
          <span class="field-value">{{ category.status ? 'Active' : 'Inactive' }}</span>
        </div>
        <div class="field-item">
          <span class="field-label">Created At:</span>
          <span class="field-value">{{ category.created_at | date:'short' }}</span>
        </div>
      </div>
    </div>
  </div>
